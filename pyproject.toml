[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "super-wised-code-llm"
version = "1.0.0"
description = "Reproducible from-scratch coding language model training project (Batch 1: JS/TS/Node.js/Express.js/NestJS)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "huggingface_hub>=0.23.0",
    "datasets>=2.19.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
