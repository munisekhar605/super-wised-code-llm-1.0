[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "super-wised-code-llm"
version = "1.0.0"
description = "Reproducible from-scratch coding language model training starter"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "transformers>=4.45", "huggingface_hub>=0.25", "datasets>=3.0", "numpy>=1.26", "safetensors>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
